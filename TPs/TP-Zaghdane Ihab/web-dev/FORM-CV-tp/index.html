<body>
<center><h1>User Loginn</h1>
<form action="traitement_login.php" method="POST">
    <h2>User login</h2>
    <label for="username">username:</label>
    <input type="text" id="username" name="username" placeholder="Your username"><br><br>

    <label for="password">password:</label>
    <input type="password" id="password" name="password" placeholder="Your password"><br><br>

    <input type="submit" value="Log in">
</form>

<h2>Leave a comment</h2>
<form action="traitement_commentaire.php" method="POST">
    <label for="nom_com">Your Name:</label>
    <input type="text" id="nom_com" name="nom_com" required><br><br>

    <label for="commentaire">Your Comment:</label>
    <textarea id="commentaire" name="commentaire" rows="5" required maxlength="500"></textarea><br><br>

    <input type="submit" value="Send Comment">
</form>
</center>
</body>
